<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="main">
        <div class="container">
            <h1 class="title">Выбери свой продукт</h1>

            <ul class="products clear-list">
                <li class="products_item card">
                    <img src="images/photo 1 (1).png" alt="" class="card_image">
                    <span class="card_category">для нормальной кожи</span>
                    <h2 class="card_name">Увлажняющий мусс</h2>
                    <p class="card_description">Глубоко увлажняют кожу лица, оставляя её мягкой и гладкой.67677677676766767676767676767676</p>

                    <div class="card_compound compound">
                        <span class="compound_name">Состав</span>
                        <ul class="compound_list">
                            <li>активные натуральные комплексы</li>
                            <li>витамины С, А, РР, В И Е</li>
                            <li>солнцезащитные компоненты</li>
                        </ul>
                    </div>

                    <div class="card_price">
                        <b>Цена</b>
                        <span>2 750</span>
                    </div>
                </li>
            </ul>
        </div>
        </main>
     </body>
</html>
